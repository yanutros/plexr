<!doctype html>
<!-- Source du bandeau du README. Rendu en PNG avec :
     msedge --headless=new --force-device-scale-factor=2 --window-size=1280,420 --screenshot=docs/banner.png docs/banner.html -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Plexr</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 420px;
        background: #0d0e10;
        overflow: hidden;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        color: #f1f1f3;
      }

      .card {
        position: absolute;
        inset: 18px;
        overflow: hidden;
        border-radius: 28px;
        background:
          radial-gradient(60% 90% at 18% 50%, #e5a00d33 0%, transparent 60%),
          radial-gradient(50% 80% at 95% 10%, #6b5bff2e 0%, transparent 60%),
          radial-gradient(40% 70% at 70% 110%, #ff4f8b26 0%, transparent 60%),
          linear-gradient(135deg, #17181c, #111215);
        box-shadow: inset 0 0 0 1px #ffffff14;
      }

      .stars span {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: #fff;
      }

      .logo {
        position: absolute;
        left: 80px;
        top: 50%;
        width: 170px;
        height: 170px;
        margin-top: -85px;
        border-radius: 44px;
        background: linear-gradient(145deg, #f7bd3a, #e5a00d 55%, #c98400);
        box-shadow:
          0 0 0 10px #e5a00d1f,
          0 0 80px 10px #e5a00d55,
          0 30px 60px #0009,
          inset 0 2px 0 #ffffff66;
        display: grid;
        place-items: center;
      }

      .logo svg {
        width: 84px;
        height: 84px;
        margin-left: 12px;
        filter: drop-shadow(0 4px 8px #0004);
      }

      .text {
        position: absolute;
        left: 310px;
        top: 50%;
        transform: translateY(-50%);
      }

      h1 {
        margin: 0;
        font-size: 104px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .tagline {
        margin-top: 12px;
        color: #c9cbd1;
        font-size: 24px;
      }

      .kicker {
        margin-top: 14px;
        color: #e5a00d;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.22em;
      }

      .chips {
        display: flex;
        gap: 8px;
        margin-top: 26px;
      }

      .chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border: 1px solid #ffffff1f;
        border-radius: 14px;
        background: #ffffff0d;
        font-size: 15px;
        font-weight: 600;
      }

      /* Éventail d'affiches abstraites sur la droite. */
      .fan {
        position: absolute;
        right: 120px;
        top: 92px;
        width: 128px;
        height: 192px;
      }

      .poster {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        box-shadow: 0 20px 40px #000b;
        transform-origin: 50% 120%;
      }

      .poster::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 34%;
        width: 52px;
        height: 52px;
        margin-left: -26px;
        border-radius: 50%;
        background: var(--sun);
        box-shadow: 0 0 40px var(--sun);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="stars">
        <span style="left: 6%; top: 18%; opacity: 0.6"></span>
        <span style="left: 14%; top: 80%; opacity: 0.4"></span>
        <span style="left: 33%; top: 12%; opacity: 0.5"></span>
        <span style="left: 52%; top: 86%; opacity: 0.3"></span>
        <span style="left: 61%; top: 9%; opacity: 0.6"></span>
        <span style="left: 72%; top: 70%; opacity: 0.4"></span>
        <span style="left: 90%; top: 88%; opacity: 0.5"></span>
        <span style="left: 97%; top: 40%; opacity: 0.4"></span>
      </div>

      <div class="logo">
        <svg viewBox="0 0 24 24" fill="#1a1300"><path d="M7 4.5v15a.5.5 0 0 0 .8.4l11.5-7.5a.5.5 0 0 0 0-.8L7.8 4.1a.5.5 0 0 0-.8.4z" /></svg>
      </div>

      <div class="text">
        <h1>Plexr</h1>
        <div class="tagline">Le client Plex de bureau, rapide et élégant</div>
        <div class="kicker">RUST · TAURI · MPV · SVELTE</div>
        <div class="chips">
          <div class="chip">🎬 Lecteur intégré</div>
          <div class="chip">🎵 Musique</div>
          <div class="chip">📥 Demandes Seerr</div>
          <div class="chip">📊 Tracearr</div>
        </div>
      </div>

      <div class="fan">
        <div class="poster" style="background: linear-gradient(#1b1440, #7a2d8c 60%, #ff8a5c); --sun: #ffd38a; transform: translateX(-56px) rotate(-14deg) scale(0.88)"></div>
        <div class="poster" style="background: linear-gradient(#0d2a2a, #1f7a6a 60%, #8af0c8); --sun: #c8fff0; transform: translateX(56px) rotate(14deg) scale(0.88)"></div>
        <div class="poster" style="background: linear-gradient(#141a3a, #3a49b8 60%, #b48cff); --sun: #ffc2f0; z-index: 2"></div>
      </div>
    </div>
  </body>
</html>
