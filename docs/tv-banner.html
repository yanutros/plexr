<!doctype html>
<!-- Bannière Android TV (320×180, res/drawable-xhdpi/banner.png). Rendu :
     msedge --headless=new --window-size=320,180 --screenshot=banner.png docs/tv-banner.html -->
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // ?theme=rouge|vert|violet : la même icône dans une autre couleur (jaune par défaut).
      const THEMES = {
        rouge: ["#ff4b52", "#e50914", "#b0060f", "#1f0203"],
        vert: ["#3ee07a", "#1db954", "#148a3e", "#04140a"],
        violet: ["#c98be0", "#aa5cc3", "#823f9b", "#ffffff"],
      };
      const t = THEMES[new URLSearchParams(location.search).get("theme")];
      if (t) {
        const s = document.documentElement.style;
        ["--light", "--accent", "--dark", "--on"].forEach((k, i) => s.setProperty(k, t[i]));
      }
    </script>
    <style>
      :root {
        --light: #f7bd3a;
        --accent: #e5a00d;
        --dark: #c98400;
        --on: #1a1300;
      }

      html,
      body {
        margin: 0;
        width: 320px;
        height: 180px;
        overflow: hidden;
        background:
          radial-gradient(70% 120% at 20% 50%, color-mix(in srgb, var(--accent) 25%, transparent), transparent 65%),
          linear-gradient(135deg, #1b1c20, #0d0e10);
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        color: #f1f1f3;
      }

      .wrap {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 100%;
        padding-left: 34px;
      }

      .logo {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border-radius: 20px;
        background: linear-gradient(145deg, var(--light), var(--accent) 55%, var(--dark));
        box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 40%, transparent);
      }

      svg {
        width: 38px;
        height: 38px;
        margin-left: 6px;
      }

      h1 {
        margin: 0;
        font-size: 50px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"><svg viewBox="0 0 24 24" style="fill: var(--on)"><path d="M7 4.5v15a.5.5 0 0 0 .8.4l11.5-7.5a.5.5 0 0 0 0-.8L7.8 4.1a.5.5 0 0 0-.8.4z" /></svg></div>
      <h1>Plexr</h1>
    </div>
  </body>
</html>
