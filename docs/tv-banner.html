<!doctype html>
<!-- Bannière Android TV (320×180, res/drawable-xhdpi/banner.png). Rendu :
     msedge --headless=new --window-size=320,180 --screenshot=banner.png docs/tv-banner.html -->
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // ?theme=rouge|vert|violet : le soleil prend la couleur du thème (or par défaut).
      const THEMES = { rouge: "#e50914", vert: "#1db954", violet: "#aa5cc3" };
      const t = THEMES[new URLSearchParams(location.search).get("theme")];
      if (t) document.documentElement.style.setProperty("--sun", t);
    </script>
    <style>
      :root {
        --sun: #f5b700;
      }

      /* Logotype : Bebas Neue (SIL OFL), celle de l'application. */
      @font-face {
        font-family: "Bebas Neue";
        src: url("../node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff2") format("woff2");
      }

      html,
      body {
        margin: 0;
        width: 320px;
        height: 180px;
        overflow: hidden;
        background:
          radial-gradient(60% 110% at 26% 50%, color-mix(in srgb, var(--sun) 22%, transparent), transparent 70%),
          #0c0c0c;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        color: #f4f1ea;
      }

      .wrap {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 100%;
        padding-left: 40px;
      }

      svg {
        width: 84px;
        height: 84px;
      }

      h1 {
        margin: 8px 0 0;
        color: var(--sun);
        font-family: "Bebas Neue", sans-serif;
        font-size: 84px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg viewBox="92 92 328 328">
        <defs>
          <mask id="stripes">
            <rect width="512" height="512" fill="#fff" />
            <rect y="282" width="512" height="12" fill="#000" />
            <rect y="318" width="512" height="18" fill="#000" />
            <rect y="360" width="512" height="24" fill="#000" />
          </mask>
        </defs>
        <circle cx="256" cy="256" r="164" fill="var(--sun)" mask="url(#stripes)" />
      </svg>
      <h1>MAKU</h1>
    </div>
  </body>
</html>
