<!doctype html>
<!-- Bannière Android TV (320×180, res/drawable-xhdpi/banner.png). Rendu :
     msedge --headless=new --window-size=320,180 --screenshot=banner.png docs/tv-banner.html -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 320px;
        height: 180px;
        overflow: hidden;
        background:
          radial-gradient(70% 120% at 20% 50%, #e5a00d40, transparent 65%),
          linear-gradient(135deg, #1b1c20, #0d0e10);
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        color: #f1f1f3;
      }

      .wrap {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 100%;
        padding-left: 34px;
      }

      .logo {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border-radius: 20px;
        background: linear-gradient(145deg, #f7bd3a, #e5a00d 55%, #c98400);
        box-shadow: 0 0 30px #e5a00d66;
      }

      svg {
        width: 38px;
        height: 38px;
        margin-left: 6px;
      }

      h1 {
        margin: 0;
        font-size: 50px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"><svg viewBox="0 0 24 24" fill="#1a1300"><path d="M7 4.5v15a.5.5 0 0 0 .8.4l11.5-7.5a.5.5 0 0 0 0-.8L7.8 4.1a.5.5 0 0 0-.8.4z" /></svg></div>
      <h1>Plexr</h1>
    </div>
  </body>
</html>
