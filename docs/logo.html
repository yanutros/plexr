<!doctype html>
<!-- Source de l'icône de Maku (1024×1024, fond transparent), ?theme=… pour les autres couleurs. Rendu puis conversion :
     msedge --headless=new --default-background-color=00000000 --window-size=1024,1024 --screenshot=docs/logo.png docs/logo.html
     npx tauri icon docs/logo.png -->
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // ?theme=rouge|vert|violet : le soleil prend la couleur du thème (or par défaut).
      const THEMES = { rouge: "#e50914", vert: "#1db954", violet: "#aa5cc3" };
      const t = THEMES[new URLSearchParams(location.search).get("theme")];
      if (t) document.documentElement.style.setProperty("--sun", t);
    </script>
    <style>
      :root {
        --sun: #f5b700;
        --night: #0c0c0c;
      }

      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
      }

      svg {
        position: absolute;
        inset: 64px;
        width: 896px;
        height: 896px;
      }
    </style>
  </head>
  <body>
    <!-- Le soleil rayé : un disque coupé de trois bandes de plus en plus larges vers le bas. -->
    <svg viewBox="0 0 512 512">
      <defs>
        <mask id="stripes">
          <rect width="512" height="512" fill="#fff" />
          <rect y="282" width="512" height="12" fill="#000" />
          <rect y="318" width="512" height="18" fill="#000" />
          <rect y="360" width="512" height="24" fill="#000" />
        </mask>
      </defs>
      <rect width="512" height="512" rx="128" fill="var(--night)" />
      <circle cx="256" cy="256" r="164" fill="var(--sun)" mask="url(#stripes)" />
    </svg>
  </body>
</html>
