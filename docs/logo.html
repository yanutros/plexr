<!doctype html>
<!-- Source de l'icône de Plexr (1024×1024, fond transparent), ?theme=… pour les autres couleurs. Rendu puis conversion :
     msedge --headless=new --default-background-color=00000000 --window-size=1024,1024 --screenshot=docs/logo.png docs/logo.html
     npx tauri icon docs/logo.png -->
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // ?theme=rouge|vert|violet : la même icône dans une autre couleur (jaune par défaut).
      const THEMES = {
        rouge: ["#ff4b52", "#e50914", "#b0060f", "#1f0203"],
        vert: ["#3ee07a", "#1db954", "#148a3e", "#04140a"],
        violet: ["#c98be0", "#aa5cc3", "#823f9b", "#ffffff"],
      };
      const t = THEMES[new URLSearchParams(location.search).get("theme")];
      if (t) {
        const s = document.documentElement.style;
        ["--light", "--accent", "--dark", "--on"].forEach((k, i) => s.setProperty(k, t[i]));
      }
    </script>
    <style>
      :root {
        --light: #f7bd3a;
        --accent: #e5a00d;
        --dark: #c98400;
        --on: #1a1300;
      }

      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
      }

      .icon {
        position: absolute;
        inset: 64px;
        border-radius: 224px;
        background: linear-gradient(145deg, var(--light), var(--accent) 55%, var(--dark));
        box-shadow: inset 0 10px 0 #ffffff55, inset 0 -18px 40px #0000002a;
        display: grid;
        place-items: center;
      }

      svg {
        width: 470px;
        height: 470px;
        margin-left: 24px;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <svg viewBox="0 0 24 24" style="fill: var(--on)"><path d="M7 4.5v15a.5.5 0 0 0 .8.4l11.5-7.5a.5.5 0 0 0 0-.8L7.8 4.1a.5.5 0 0 0-.8.4z" /></svg>
    </div>
  </body>
</html>
