[package]
name = "plexr"
version = "0.8.1"
description = "Client Plex de bureau en Rust, avec demandes Seerr intégrées"
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "plexr_lib"
# cdylib et staticlib : bibliothèques chargées par les applications Android et iOS.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["process", "net", "io-util", "time", "sync", "macros", "rt"] }
futures = "0.3"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
